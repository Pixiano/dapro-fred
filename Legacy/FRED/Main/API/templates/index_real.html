<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F.R.E.D. By Da Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #0a0a0a; 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex; flex-direction: column; 
            height: 100vh; 
        }
        header { 
            text-align: center; font-size: 2em; padding: 15px; 
            color: #39ff14; font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
        }
        #verification-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; color: white; font-size: 130%;
        }
        #verification-overlay input[type=text],
        #verification-overlay input[type=password],
        #verification-overlay input[type=submit] {
            padding: 10px; font-size: 1em; border-radius: 5px; border: none; margin: 5px;
        }
        #verification-overlay input[type=submit] {
            background: #39ff14; color: black; cursor: pointer;
        }
        #status { margin-top: 15px; font-size: 1.2em; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; background-color: #111; display: none; flex-direction: column; }
        .message { margin: 8px 0; padding: 10px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
        .user { background-color: #1e90ff; color: white; align-self: flex-start; }
        .fred { background-color: #ff4500; color: white; align-self: flex-end; }
        #input-box { display: none; padding: 10px; background-color: #222; flex-direction: row; }
        #msg-input { flex: 1; padding: 10px; border-radius: 5px; border: none; font-size: 1em; margin-right: 10px; }
        #send-btn { padding: 10px 20px; font-size: 1em; border: none; border-radius: 5px; background-color: #39ff14; color: black; cursor: pointer; }
        .god { color: #02dff7; font-weight: bold; }
        .friend { color: white; font-weight: bold; }
        #typing-indicator { display: none; color: gray; font-style: italic; margin-left: 15px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <header>F.R.E.D. - Friendly | Responsive | Rational | Rakish Electronic Dude By Vatsal Da Pro</header>

    <!-- Verification overlay -->
    <div id="verification-overlay">
        <h2>Enter Your Name and Password:</h2>
        <div>
            <input type="text" id="name-input" placeholder="Your Name"><br>
            <input type="password" id="pass-input" placeholder="Password"><br>
            <input type="submit" id="verify-btn" value="Verify">
        </div>
        <div id="status"></div>
    </div>

    <!-- Typing indicator -->
    <div id="typing-indicator">F.R.E.D. is thinking...</div>

    <!-- Chat area -->
    <div id="chat"></div>
    <div id="input-box">
        <input type="text" id="msg-input" placeholder="Type a message..." autofocus />
        <button id="send-btn">Send</button>
    </div>

    <script>
        // ======= NGROK-SAFE SOCKET.IO =======
        const SERVER_URL = "https://colourful-biliously-annie.ngrok-free.dev"; // remove trailing slash
        const socket = io(SERVER_URL, { transports: ["websocket"] }); // force websocket only

        let username = "";
        let loggedIn = false;
        const chatDiv = document.getElementById("chat");
        const inputBox = document.getElementById("input-box");
        const input = document.getElementById("msg-input");
        const sendBtn = document.getElementById("send-btn");
        const typingIndicator = document.getElementById("typing-indicator");
        const verificationOverlay = document.getElementById("verification-overlay");
        const nameInput = document.getElementById("name-input");
        const passInput = document.getElementById("pass-input");
        const verifyBtn = document.getElementById("verify-btn");
        const statusDiv = document.getElementById("status");

        function appendMessage(text, cls) {
            const div = document.createElement("div");
            div.className = `message ${cls}`;
            div.innerText = text;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // ===== VERIFICATION =====
        verifyBtn.onclick = () => {
            const enteredName = nameInput.value.trim();
            const enteredPass = passInput.value.trim();
            if (!enteredName || !enteredPass) return;
            socket.emit("verify_user", { username: enteredName, password: enteredPass });
        };

        socket.on("verify_response", (data) => {
            if (data.success) {
                username = data.name;
                if (username.toLowerCase() === "vatsal" || username.toLowerCase() === "vatsal da pro") {
                    statusDiv.textContent = "✅ Verified! Welcome God!";
                    statusDiv.className = "god";
                } else if (username.toLowerCase() === "suhani") {
                    statusDiv.textContent = "✅ Verified! Welcome, " + username;
                    statusDiv.className = "friend";
                } else {
                    statusDiv.textContent = "✅ Verified! Welcome, " + username;
                    statusDiv.className = "friend";
                }
                setTimeout(() => {
                    verificationOverlay.style.display = "none";
                    chatDiv.style.display = "flex";
                    inputBox.style.display = "flex";
                    input.focus();
                    loggedIn = true;
                }, 2000);
            } else {
                statusDiv.textContent = "❌ Invalid name or password!";
                statusDiv.style.color = "red";
            }
        });

        // ===== CHAT =====
        sendBtn.onclick = () => {
            if (!loggedIn) return;
            const msg = input.value.trim();
            if (!msg) return;
            appendMessage("You: " + msg, "user");
            typingIndicator.style.display = "block";
            socket.emit("message", { message: msg }); // <-- no sid
            input.value = "";
        };

        input.addEventListener("keyup", (e) => {
            if (e.key === "Enter") sendBtn.click();
        });

        socket.on("bot_reply", (data) => {
            typingIndicator.style.display = "none";
            appendMessage("FRED: " + data.reply, "fred");

            // Browser TTS
            if ("speechSynthesis" in window) {
                const utterance = new SpeechSynthesisUtterance(data.reply);
                utterance.lang = "en-US";
                utterance.pitch = 1.3;
                utterance.rate = 1;
                utterance.volume = 1.0;
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
            }
        });
    </script>
</body>
</html>
